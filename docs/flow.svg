<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1045" width="1200" height="1045" font-family="Helvetica,Arial,sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs>
<rect width="1200" height="1045" fill="#ffffff"/>
<text x="600" y="38" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">CO2 Emissions ML: how it works, end to end</text>
<rect x="20" y="60" width="1160" height="170" rx="14" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
<text x="40" y="90" font-size="19" font-weight="700" fill="#1d4ed8">1  BUILD  (run once, offline)   command: co2-ml train</text>
<rect x="40" y="115" width="190" height="90" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.8"/>
<text x="135.0" y="155.0" text-anchor="middle" font-size="15" font-weight="400" fill="#0f172a">Dataset</text>
<text x="135.0" y="175.0" text-anchor="middle" font-size="15" font-weight="400" fill="#0f172a">CO2_Emissions.csv</text>
<rect x="270" y="115" width="190" height="90" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.8"/>
<text x="365.0" y="145.0" text-anchor="middle" font-size="15" font-weight="400" fill="#0f172a">Clean and split</text>
<text x="365.0" y="165.0" text-anchor="middle" font-size="15" font-weight="400" fill="#0f172a">remove duplicates</text>
<text x="365.0" y="185.0" text-anchor="middle" font-size="15" font-weight="400" fill="#0f172a">80% train / 20% test</text>
<rect x="500" y="115" width="190" height="90" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.8"/>
<text x="595.0" y="145.0" text-anchor="middle" font-size="15" font-weight="400" fill="#0f172a">Train 13 models</text>
<text x="595.0" y="165.0" text-anchor="middle" font-size="15" font-weight="400" fill="#0f172a">5-fold cross-validation</text>
<text x="595.0" y="185.0" text-anchor="middle" font-size="15" font-weight="400" fill="#0f172a">(Ridge, RF, XGBoost...)</text>
<rect x="730" y="115" width="190" height="90" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.8"/>
<text x="825.0" y="145.0" text-anchor="middle" font-size="15" font-weight="400" fill="#0f172a">Tune the best 3</text>
<text x="825.0" y="165.0" text-anchor="middle" font-size="15" font-weight="400" fill="#0f172a">random search of</text>
<text x="825.0" y="185.0" text-anchor="middle" font-size="15" font-weight="400" fill="#0f172a">hyperparameters</text>
<rect x="960" y="115" width="190" height="90" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.8"/>
<text x="1055.0" y="145.0" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">MODEL REGISTRY</text>
<text x="1055.0" y="165.0" text-anchor="middle" font-size="15" font-weight="400" fill="#0f172a">versions + metrics</text>
<text x="1055.0" y="185.0" text-anchor="middle" font-size="15" font-weight="400" fill="#0f172a">+ the CHAMPION</text>
<line x1="230" y1="160" x2="270" y2="160" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<line x1="460" y1="160" x2="500" y2="160" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<line x1="690" y1="160" x2="730" y2="160" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<line x1="920" y1="160" x2="960" y2="160" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<rect x="20" y="255" width="1160" height="230" rx="14" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
<text x="40" y="285" font-size="19" font-weight="700" fill="#15803d">2  SERVE  (always on)   command: co2-ml serve</text>
<rect x="40" y="330" width="170" height="80" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.8"/>
<text x="125.0" y="365.0" text-anchor="middle" font-size="15" font-weight="400" fill="#0f172a">User or app</text>
<text x="125.0" y="385.0" text-anchor="middle" font-size="15" font-weight="400" fill="#0f172a">sends vehicle data</text>
<rect x="260" y="330" width="190" height="80" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.8"/>
<text x="355.0" y="365.0" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">FastAPI service</text>
<text x="355.0" y="385.0" text-anchor="middle" font-size="15" font-weight="400" fill="#0f172a">checks the input</text>
<rect x="520" y="300" width="330" height="66" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.8"/>
<text x="685.0" y="328.0" text-anchor="middle" font-size="15" font-weight="400" fill="#0f172a">POST /predict</text>
<text x="685.0" y="348.0" text-anchor="middle" font-size="15" font-weight="400" fill="#0f172a">CO2 g/km + SHAP: which features drove it</text>
<rect x="520" y="386" width="330" height="66" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.8"/>
<text x="685.0" y="414.0" text-anchor="middle" font-size="15" font-weight="400" fill="#0f172a">POST /ask</text>
<text x="685.0" y="434.0" text-anchor="middle" font-size="15" font-weight="400" fill="#0f172a">question answered by the RAG assistant</text>
<rect x="900" y="330" width="250" height="80" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.8"/>
<text x="1025.0" y="355.0" text-anchor="middle" font-size="15" font-weight="400" fill="#0f172a">Loads the champion</text>
<text x="1025.0" y="375.0" text-anchor="middle" font-size="15" font-weight="400" fill="#0f172a">from the registry on</text>
<text x="1025.0" y="395.0" text-anchor="middle" font-size="15" font-weight="400" fill="#0f172a">every request</text>
<line x1="210" y1="370" x2="260" y2="370" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<line x1="450" y1="355" x2="520" y2="335" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<line x1="450" y1="385" x2="520" y2="419" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<line x1="1055" y1="205" x2="1055" y2="330" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<text x="1100" y="272" text-anchor="middle" font-size="13" font-weight="700" fill="#c2410c">model file</text>
<rect x="20" y="510" width="1160" height="170" rx="14" fill="#faf5ff" stroke="#7e22ce" stroke-width="2"/>
<text x="40" y="540" font-size="19" font-weight="700" fill="#7e22ce">3  RAG  (the assistant that explains and answers)   command: co2-ml index</text>
<rect x="40" y="565" width="190" height="90" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.8"/>
<text x="135.0" y="595.0" text-anchor="middle" font-size="15" font-weight="400" fill="#0f172a">Knowledge</text>
<text x="135.0" y="615.0" text-anchor="middle" font-size="15" font-weight="400" fill="#0f172a">docs, model cards,</text>
<text x="135.0" y="635.0" text-anchor="middle" font-size="15" font-weight="400" fill="#0f172a">monitoring reports</text>
<rect x="270" y="565" width="190" height="90" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.8"/>
<text x="365.0" y="595.0" text-anchor="middle" font-size="15" font-weight="400" fill="#0f172a">Chunk + embed</text>
<text x="365.0" y="615.0" text-anchor="middle" font-size="15" font-weight="400" fill="#0f172a">~90-word pieces</text>
<text x="365.0" y="635.0" text-anchor="middle" font-size="15" font-weight="400" fill="#0f172a">turned into vectors</text>
<rect x="500" y="565" width="190" height="90" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.8"/>
<text x="595.0" y="595.0" text-anchor="middle" font-size="15" font-weight="400" fill="#0f172a">Vector index</text>
<text x="595.0" y="615.0" text-anchor="middle" font-size="15" font-weight="400" fill="#0f172a">finds the pieces</text>
<text x="595.0" y="635.0" text-anchor="middle" font-size="15" font-weight="400" fill="#0f172a">closest to the question</text>
<rect x="730" y="565" width="190" height="90" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="1.8"/>
<text x="825.0" y="595.0" text-anchor="middle" font-size="15" font-weight="400" fill="#0f172a">Retrieve top 4</text>
<text x="825.0" y="615.0" text-anchor="middle" font-size="15" font-weight="400" fill="#0f172a">if nothing is close:</text>
<text x="825.0" y="635.0" text-anchor="middle" font-size="15" font-weight="400" fill="#0f172a">say I DON'T KNOW</text>
<rect x="960" y="565" width="190" height="90" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.8"/>
<text x="1055.0" y="595.0" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Cited answer</text>
<text x="1055.0" y="615.0" text-anchor="middle" font-size="15" font-weight="400" fill="#0f172a">built only from the</text>
<text x="1055.0" y="635.0" text-anchor="middle" font-size="15" font-weight="400" fill="#0f172a">retrieved text [1][2]</text>
<line x1="230" y1="610" x2="270" y2="610" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<line x1="460" y1="610" x2="500" y2="610" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<line x1="690" y1="610" x2="730" y2="610" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<line x1="920" y1="610" x2="960" y2="610" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<rect x="20" y="705" width="1160" height="285" rx="14" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
<text x="40" y="735" font-size="19" font-weight="700" fill="#c2410c">4  MONITOR and RETRAIN  (scheduled)   command: co2-ml retrain</text>
<rect x="40" y="775" width="170" height="90" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.8"/>
<text x="125.0" y="805.0" text-anchor="middle" font-size="15" font-weight="400" fill="#0f172a">New data</text>
<text x="125.0" y="825.0" text-anchor="middle" font-size="15" font-weight="400" fill="#0f172a">with the true</text>
<text x="125.0" y="845.0" text-anchor="middle" font-size="15" font-weight="400" fill="#0f172a">CO2 values</text>
<rect x="250" y="775" width="200" height="90" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.8"/>
<text x="350.0" y="805.0" text-anchor="middle" font-size="15" font-weight="400" fill="#0f172a">Score the champion</text>
<text x="350.0" y="825.0" text-anchor="middle" font-size="15" font-weight="400" fill="#0f172a">RMSE, MAE, R2</text>
<text x="350.0" y="845.0" text-anchor="middle" font-size="15" font-weight="400" fill="#0f172a">drift (PSI)</text>
<polygon points="590,760.0 685.0,820 590,880.0 495.0,820" fill="#fff7ed" stroke="#c2410c" stroke-width="1.8"/>
<text x="590" y="805" text-anchor="middle" font-size="14" fill="#0f172a">Metrics worse</text>
<text x="590" y="825" text-anchor="middle" font-size="14" fill="#0f172a">or drift too</text>
<text x="590" y="845" text-anchor="middle" font-size="14" fill="#0f172a">high?</text>
<rect x="760" y="775" width="190" height="90" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.8"/>
<text x="855.0" y="805.0" text-anchor="middle" font-size="15" font-weight="400" fill="#0f172a">Re-tune models</text>
<text x="855.0" y="825.0" text-anchor="middle" font-size="15" font-weight="400" fill="#0f172a">on old + new data</text>
<text x="855.0" y="845.0" text-anchor="middle" font-size="15" font-weight="400" fill="#0f172a">(challenger)</text>
<polygon points="1070,760.0 1165.0,820 1070,880.0 975.0,820" fill="#fff7ed" stroke="#c2410c" stroke-width="1.8"/>
<text x="1070" y="805" text-anchor="middle" font-size="14" fill="#0f172a">Challenger</text>
<text x="1070" y="825" text-anchor="middle" font-size="14" fill="#0f172a">beats champion</text>
<text x="1070" y="845" text-anchor="middle" font-size="14" fill="#0f172a">by 1%+ RMSE?</text>
<line x1="210" y1="820" x2="250" y2="820" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<line x1="450" y1="820" x2="495" y2="820" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<line x1="685" y1="820" x2="760" y2="820" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<text x="722" y="810" text-anchor="middle" font-size="13" font-weight="700" fill="#c2410c">YES</text>
<line x1="950" y1="820" x2="975" y2="820" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<rect x="40" y="915" width="300" height="60" rx="10" fill="#faf5ff" stroke="#7e22ce" stroke-width="1.8"/>
<text x="190.0" y="940.0" text-anchor="middle" font-size="15" font-weight="400" fill="#0f172a">Every check saves a report</text>
<text x="190.0" y="960.0" text-anchor="middle" font-size="15" font-weight="400" fill="#0f172a">the RAG assistant can read later</text>
<rect x="380" y="915" width="340" height="60" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.8"/>
<text x="550.0" y="940.0" text-anchor="middle" font-size="15" font-weight="400" fill="#0f172a">NO: keep the current champion</text>
<text x="550.0" y="960.0" text-anchor="middle" font-size="15" font-weight="400" fill="#0f172a">and keep watching</text>
<rect x="930" y="915" width="220" height="60" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.8"/>
<text x="1040.0" y="940.0" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">YES: PROMOTE</text>
<text x="1040.0" y="960.0" text-anchor="middle" font-size="15" font-weight="400" fill="#0f172a">challenger = new champion</text>
<line x1="590" y1="880" x2="590" y2="915" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<text x="610" y="903" text-anchor="middle" font-size="13" font-weight="700" fill="#c2410c">NO</text>
<line x1="1030" y1="862" x2="720" y2="935" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<text x="880" y="912" text-anchor="middle" font-size="13" font-weight="700" fill="#c2410c">NO</text>
<line x1="1090" y1="878" x2="1060" y2="915" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<text x="1105" y="903" text-anchor="middle" font-size="13" font-weight="700" fill="#c2410c">YES</text>
<text x="600" y="1025" text-anchor="middle" font-size="14" fill="#475569">Rule: the trained regression model makes the number. SHAP and RAG only explain it.</text>
</svg>