[build-system]
requires=["setuptools>=61"]
build-backend="setuptools.build_meta"
[project]
name="co2_ml"
version="1.0.0"
description="Production-style CO2 emissions regression: model zoo, tuning, registry, monitoring, auto-retrain"
requires-python=">=3.9"
license={text="MIT"}
authors=[{name="Ankit Kumar Sharma"}]
dependencies=["pandas","numpy","scikit-learn","scipy","pyyaml","joblib"]
[project.optional-dependencies]
boosters=["xgboost","lightgbm"]
[project.scripts]
co2-ml="co2_ml.cli:main"
[tool.setuptools.packages.find]
where=["src"]
